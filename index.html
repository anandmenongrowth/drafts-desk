<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drafts Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#BFE3F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drafts Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
:root{--coral:#FF6F61;--coral-d:#E4574A;--coral-l:#FFE3DE;--sky:#E9F6FB;--sky2:#BFE3F2;--sky3:#9ED8EE;--ink:#1F3A4A;--muted:#5F7A8A;--line:#D3E8F1;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--white);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(var(--sky),var(--sky2));border-bottom:1px solid var(--line)}
header img{width:54px;height:auto;display:block}
header h1{font-size:23px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:14px;color:var(--muted);margin-top:-2px}
header .sp{flex:1}
header button.ref{background:var(--white);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:15px}
main{padding:16px;max-width:680px;margin:0 auto}
h2{font-size:20px;margin:18px 0 8px}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px;box-shadow:0 2px 10px rgba(110,170,200,.15)}
.card.soft{background:var(--sky);border-color:var(--sky2);box-shadow:none}
textarea,select,input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--white);border:1.5px solid var(--sky2);border-radius:14px;padding:12px;outline:none}
textarea:focus,select:focus,input:focus{border-color:var(--coral)}
textarea{resize:vertical;min-height:130px}
label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:16px}
.btn:active{background:var(--coral-d)}
.btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--sky2)}
.btn.sky{background:var(--sky2);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:15px}
.btn[disabled]{opacity:.5}
body.busy .btn{opacity:.55;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;flex:none;white-space:nowrap;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--sky2);color:var(--ink)}
.chip.ready{background:var(--coral-l);color:var(--coral-d)}
.chip.posted{background:#D9F2E3;color:#25704A}
.chip.warn{background:#FFF1CC;color:#8A6200}
.chip.dim{background:#EEF3F6;color:var(--muted)}
.muted{color:var(--muted);font-size:15px}
.var{background:var(--sky);border:1px solid var(--sky2);border-radius:14px;padding:12px;margin:10px 0}
.var .t{white-space:pre-wrap;margin:8px 0 10px}
.q{background:var(--coral-l);border-radius:12px;padding:10px 12px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--white);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:14px;position:relative}
nav button .ic{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--coral-d);font-weight:700}
nav .badge{position:absolute;top:0;left:56%;background:var(--coral);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty img{width:120px;opacity:.95}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:16px;z-index:9;max-width:90%;text-align:center}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hello{text-align:center;padding:30px 6px 10px}
.hello img{width:170px}
.item .tx.full{display:block;overflow:visible}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--sky)}
.bar{display:flex;gap:4px;margin:8px 0}
.seg{flex:1;height:7px;border-radius:4px;background:var(--line);display:block}
.seg.done{background:var(--sky3)}
.seg.cur{background:var(--coral)}
.stepper{margin-top:12px}
.stg{display:flex;align-items:center;gap:10px;padding:5px 0;color:var(--muted)}
.stg .dot{width:26px;height:26px;border-radius:50%;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink);flex:none}
.stg.done{color:var(--ink)}
.stg.done .dot{background:var(--sky3)}
.stg.cur{color:var(--ink);font-weight:800}
.stg.cur .dot{background:var(--coral);color:#fff}
h3{font-size:18px}
textarea.big{min-height:46vh}
@media (min-width:900px){main{max-width:880px}textarea.big{min-height:62vh}.doc{font-size:18px}}
.item.tap{cursor:pointer}
.item.tap:active{background:var(--sky)}
.lbl{font-size:13px;color:var(--muted);background:var(--sky);border-radius:8px;padding:3px 8px;margin:14px 0 6px;display:inline-block}
.doc{font-size:17px}
.doc.pre{white-space:pre-wrap}
.doc p.md{margin:0 0 12px}
.doc h2.md,.doc h3.md,.doc h4.md{margin:18px 0 8px;line-height:1.25}
.doc .li{margin:0 0 8px;padding-left:4px}
.doc hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.card.tap,.item.tap{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.fold{cursor:pointer}
.fold .more{display:none;white-space:pre-wrap;margin-top:6px}
.fold.open .more{display:block}
.fold.open .less{display:none}
.fold .less{color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tiny{font-size:13px;color:var(--muted)}
.dlg{position:fixed;inset:0;background:rgba(31,58,74,.45);z-index:20;align-items:center;justify-content:center;padding:20px}
.dlgbox{background:var(--white);border-radius:20px;padding:20px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(31,58,74,.3)}
#dlgmsg{white-space:pre-line;font-size:17px;line-height:1.45}
body:has(#dlg[style*="flex"]) .btn{pointer-events:auto;opacity:1}
code{background:var(--sky);padding:1px 6px;border-radius:6px;font-size:15px}
</style>
</head>
<body>
<header>
  <img src="mascot.png" alt="">
  <div><h1>Drafts Desk</h1><div class="sub" id="sub">ideas in, posts out</div></div>
  <div class="sp"></div>
  <button class="ref" id="refresh" aria-label="Refresh">Refresh</button>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast" class="toast" style="display:none"></div>
<div id="dlg" class="dlg" style="display:none"><div class="dlgbox"><div id="dlgmsg"></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" id="dlgno">Cancel</button><button class="btn" id="dlgok">OK</button></div></div></div>

<script src="core.js"></script>
<script src="posts.js"></script>
<script>
const LS = {get(k, d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const S = {conn: LS.get('dd_conn', null), tab: 'capture', loaded: false, loading: false, open: {}, err: '', stack: [], reader: null, lib: [], docs: {}, pp: {}, pending: {}, savedAt: {}, files: {}, buf: {}, pipe: null, newPost: null, pollUntil: 0};
const API = 'https://api.github.com/repos/';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const b64e = s => btoa(unescape(encodeURIComponent(s)));

/** The app's own confirm dialog. The browser's confirm() always prints the site address above the message, this does not. */
function askConfirm(msg, okLabel){
  return new Promise(res => {
    const d = $('dlg'); $('dlgmsg').textContent = msg; $('dlgok').textContent = okLabel || 'OK';
    d.style.display = 'flex';
    const done = v => { d.style.display = 'none'; S.dlgCancel = null; res(v); };
    S.dlgCancel = () => done(false);
    $('dlgok').onclick = () => done(true); $('dlgno').onclick = () => done(false);
    d.onclick = e => { if(e.target === d) done(false); };
  });
}
function toast(m, ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms||2600)}

/* ---------- GitHub ---------- */
let inflight = 0, busyUntil = 0;
function maybeIdle(){
  if(inflight > 0) return;
  const w = busyUntil - Date.now();
  if(w > 0) setTimeout(maybeIdle, w + 20); else document.body.classList.remove('busy');
}
function gh(path, opt){
  opt = opt || {};
  const write = opt.method === 'PUT' || opt.method === 'DELETE';
  if(write){ inflight++; document.body.classList.add('busy'); }
  const done = () => { if(write){ inflight--; maybeIdle(); } };
  return fetch(API + S.conn.repo + path, {cache:'no-store', ...opt, headers:{Authorization:'Bearer ' + S.conn.token, Accept:'application/vnd.github+json', ...(opt.headers||{})}}).then(r => { done(); return r; }, e => { done(); throw e; });
}
/* One tap at a time (same idea as Inflekt OS). The first tap on any button locks every button until its work has
   finished and at least 0.7s has passed, so a double tap or a nervous second tap can never run an action twice. */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button.btn, a.btn');
  if(!b) return;
  if(document.body.classList.contains('busy')){ e.preventDefault(); e.stopImmediatePropagation(); return; }
  document.body.classList.add('busy'); busyUntil = Date.now() + 700;
  setTimeout(maybeIdle, 720);
}, true);
async function list(dir){
  const r = await gh('/contents/' + encodeURI(dir));
  if(r.status === 404) return [];
  if(!r.ok) throw new Error(dir + ' ' + r.status);
  const j = await r.json();
  return Array.isArray(j) ? j.filter(f => f.type === 'file') : [];
}
async function raw(path){
  const r = await gh('/contents/' + encodeURI(path), {headers:{Accept:'application/vnd.github.raw+json'}});
  if(!r.ok) throw new Error(path + ' ' + r.status);
  return r.text();
}
async function put(path, text, msg){
  let sha;
  const r0 = await gh('/contents/' + encodeURI(path));
  if(r0.ok) sha = (await r0.json()).sha;
  const body = {message: msg, content: b64e(text)}; if(sha) body.sha = sha;
  const r = await gh('/contents/' + encodeURI(path), {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if(!r.ok) throw new Error('save failed ' + r.status);
}
async function del(path, msg){
  const r0 = await gh('/contents/' + encodeURI(path));
  if(!r0.ok) return;
  const sha = (await r0.json()).sha;
  const r = await gh('/contents/' + encodeURI(path), {method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: msg, sha})});
  if(!r.ok) throw new Error('delete failed ' + r.status);
}

/* ---------- load ---------- */
async function load(){
  if(!S.conn || S.loading) return;
  S.loading = true; S.err = ''; render();
  try{
    const lib = await raw('library.json').then(t => JSON.parse(t)).catch(() => S.lib);
    S.lib = Array.isArray(lib) ? lib : [];
    S.loaded = true;
    await loadPosts();
  }catch(e){ S.err = String(e.message || e); }
  S.loading = false; render();
}
async function copy(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(_){} a.remove(); }
  toast('Copied');
}
function toggle(key){ S.open[key] = !S.open[key]; render(); }

/* ---------- navigation ---------- */
function go(tab){ if(tab === S.tab && !S.reader){ render(); return; } if(!S.reader) S.stack.push(S.tab); if(S.stack.length > 20) S.stack.shift(); S.reader = null; S.tab = tab; render(); window.scrollTo(0, 0); }
function openReader(r){ S.reader = r; render(); window.scrollTo(0, 0); if(r.type === 'long') loadDoc(r.mode === 'article' ? r.item.files.article : r.item.files.linkedin); }
function setMode(m){ if(!S.reader) return; S.reader.mode = m; render(); loadDoc(m === 'article' ? S.reader.item.files.article : S.reader.item.files.linkedin); }
async function loadDoc(path){
  if(!path || S.docs[path] !== undefined) return;
  S.docs[path] = null; render();
  try{ S.docs[path] = await raw(path); }catch(e){ S.docs[path] = 'Could not load this file (' + e.message + ').'; }
  render();
}
async function disconnect(){ if(await askConfirm('Disconnect this phone and enter the token again?', 'Disconnect')){ LS.del('dd_conn'); S.conn = null; S.loaded = false; S.reader = null; S.stack = []; render(); } }
function mdHtml(t){
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<i>$2</i>');
  return String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(b => {
    let lines = b.split('\n').map(l => l.replace(/\s+$/, '')).filter(l => l.trim() !== ''), out = '';
    if(!lines.length) return '';
    if(/^>>/.test(lines[0])){ out += '<div class="lbl">' + esc(lines[0].replace(/^>>\s*/, '')) + '</div>'; lines = lines.slice(1); }
    if(!lines.length) return out;
    if(/^-{5,}$/.test(lines[0].trim())) return out + '<hr>';
    const h = lines[0].match(/^(#{1,3})\s+(.*)$/);
    if(h){ out += '<h' + (h[1].length + 1) + ' class="md">' + inl(h[2]) + '</h' + (h[1].length + 1) + '>'; lines = lines.slice(1); if(!lines.length) return out; }
    if(lines.every(l => /^(\s*[-*]|\s*\d+\.)\s+/.test(l))) return out + lines.map(l => '<div class="li">' + inl(l.trim()) + '</div>').join('');
    return out + '<p class="md">' + inl(lines.join(' ')) + '</p>';
  }).join('');
}

/* ---------- views ---------- */
const snip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '...' : s; };

function vSetup(){
  const h = new URLSearchParams(location.hash.slice(1));
  return '<div class="hello"><img src="mascot.png" alt=""><h2 style="margin:6px 0">Hello, writer</h2><div class="muted">Connect this app to your writing repo once and it remembers.</div></div>' +
    '<div class="card"><label>Repo (owner/name)</label><input id="c-repo" autocapitalize="none" autocorrect="off" value="' + esc(h.get('repo') || '') + '" placeholder="owner/repo">' +
    '<label>GitHub token (fine-grained, this repo only, Contents read and write)</label><input id="c-token" type="password" autocapitalize="none" autocorrect="off" placeholder="github_pat_...">' +
    '<p class="muted">The token stays on this phone only. Nothing is sent anywhere except GitHub.</p>' +
    '<button class="btn" id="connect">Connect</button></div>';
}
function vCapture(){
  const shorts = Object.values(S.pp).filter(p => p.track === 'short').sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  const opts = '<option value="none">Nothing, a fresh idea</option>' + shorts.slice(0, 15).map(p => '<option value="' + esc(p.slug) + '">' + esc(snip(p.title, 46)) + '</option>').join('');
  const recent = shorts.slice(0, 6).map(p => '<div class="item tap" data-post="' + esc(p.slug) + '"><div class="tx">' + esc(snip(p.title, 120)) + '</div>' + schip(pstate(p)) + '</div>').join('');
  return '<div class="card"><label style="margin-top:0">New idea. Type, or tap the microphone on your keyboard and talk.</label>' +
    '<textarea id="idea" placeholder="What did you notice, learn or get wrong? Rough is fine. You can also tell Claude what to research, for example find what is happening in India."></textarea>' +
    '<label>Build on an earlier short post (optional)</label><select id="buildon">' + opts + '</select>' +
    '<div style="margin-top:14px"><button class="btn" id="save">Start short post</button></div></div>' +
    '<h2>Recent short posts</h2><div class="card">' + (recent || '<div class="empty"><img src="mascot.png" alt=""><div>No short posts yet. The albatross is waiting.</div></div>') + '</div>';
}
function sortedLib(){ return S.lib.slice().sort((x, y) => String(y.date).localeCompare(String(x.date))); }
function vLibrary(){
  const lib = sortedLib(), order = ['Inflektion Point', 'Personal', 'Short post'];
  const tracks = [...new Set(lib.map(i => i.track))].sort((x, y) => (order.indexOf(x) < 0 ? 9 : order.indexOf(x)) - (order.indexOf(y) < 0 ? 9 : order.indexOf(y)));
  let h = '';
  tracks.forEach(t => {
    h += '<h2>' + esc(t === 'Short post' ? 'Short posts' : t) + '</h2><div class="card">' + lib.map((it, i) => it.track !== t ? '' : '<div class="item tap" data-lib="' + i + '"><div class="tx full"><b>' + esc(t === 'Short post' ? snip(it.title, 80) : it.title) + '</b><div class="muted">' + esc(it.date) + (it.files.linkedin ? ' &middot; with LinkedIn version' : '') + '</div></div><span class="chip posted">' + (t === 'Short post' ? 'Posted' : 'Published') + '</span></div>').join('') + '</div>';
  });
  if(!lib.length) h += '<h2>Published</h2><div class="card"><div class="muted">Nothing published yet. Finished posts appear here.</div></div>';
  return h;
}
function vReader(){
  const r = S.reader;
  if(r.type === 'post') return vPost(r);
  let h = '<div class="row" style="margin-bottom:10px"><button class="btn sm ghost" onclick="history.back()">&larr; Back</button></div>';
  const it = r.item; if(!it.files.linkedin) r.mode = 'article';
  const path = r.mode === 'article' ? it.files.article : it.files.linkedin, doc = S.docs[path];
  h += '<div class="card"><h2 style="margin-top:0">' + esc(it.track === 'Short post' ? 'Short post' : it.title) + '</h2><div class="muted">' + esc(it.date) + ' &middot; ' + esc(it.track) + '</div>' +
    (it.files.linkedin ? '<div class="row" style="margin:12px 0"><button class="btn sm ' + (r.mode === 'linkedin' ? '' : 'ghost') + '" onclick="setMode(\'linkedin\')">LinkedIn version</button><button class="btn sm ' + (r.mode === 'article' ? '' : 'ghost') + '" onclick="setMode(\'article\')">Full article</button></div>' : '') +
    '<div class="row" style="margin:12px 0"><button class="btn sm sky" data-copytext="doc">Copy text</button>' + (it.url ? '<a class="btn sm ghost" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(it.url) + '">Open on Substack</a>' : '') + '</div>' +
    (doc == null ? '<p class="muted">Loading...</p>' : (r.mode === 'article' && /\.md$/.test(path) && it.track !== 'Short post' ? '<div class="doc">' + mdHtml(doc) + '</div>' : '<div class="doc pre">' + esc(doc) + '</div>')) + '</div>';
  return h;
}

function render(){
  const main = $('main'), nav = $('nav');
  if(!S.conn){ main.innerHTML = vSetup(); nav.style.display = 'none'; $('refresh').style.display = 'none'; $('connect').onclick = connect; return; }
  nav.style.display = 'flex'; $('refresh').style.display = '';
  const keep = S.tab === 'capture' && !S.reader && $('idea') ? $('idea').value : (LS.get('dd_draft', ''));
  $('sub').textContent = S.loading ? 'checking the shore...' : 'ideas in, posts out';
  let body = '';
  if(S.err) body += '<div class="card" style="border-color:var(--coral)"><b>Could not load</b><div class="muted">' + esc(S.err) + '</div><div class="row" style="margin-top:10px"><button class="btn sm" onclick="load()">Try again</button><button class="btn sm ghost" onclick="disconnect()">Reconnect this phone</button></div></div>';
  body += S.reader ? vReader() : ({capture: vCapture, short: () => vPosts('short'), long: () => vPosts('long'), library: vLibrary}[S.tab] || vCapture)();
  main.innerHTML = body;
  const bd = k => (S.pipe && needsYou(k) ? '<span class="badge">' + needsYou(k) + '</span>' : '');
  nav.innerHTML = [['capture','&#9998;','Capture'],['short','&#9733;','Short Posts'],['long','&#9873;','Long Posts'],['library','&#9776;','Library']].map(([k,ic,l]) =>
    '<button class="' + (S.tab === k && !S.reader ? 'on' : '') + '" data-tab="' + k + '"><span class="ic">' + ic + '</span>' + l + (k === 'short' ? bd('short') : k === 'long' ? bd('long') : '') + '</button>').join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.tab));
  if(S.tab === 'capture' && !S.reader){
    const ta = $('idea'); if(ta){ ta.value = keep; ta.oninput = () => LS.set('dd_draft', ta.value); $('save').onclick = startShort; }
  }
  main.querySelectorAll('textarea[data-buf],input[data-buf]').forEach(el => { const k = el.dataset.buf; el.value = S.buf[k] !== undefined ? S.buf[k] : (el.dataset.init || ''); el.oninput = () => { S.buf[k] = el.value; }; });
  bindPostCards(main);
  main.querySelectorAll('[data-lib]').forEach(b => b.onclick = () => { const it = sortedLib()[+b.dataset.lib]; openReader({type: 'long', item: it, mode: it.files.linkedin ? 'linkedin' : 'article'}); });
  main.querySelectorAll('[data-copytext]').forEach(b => b.onclick = () => {
    const r = S.reader; if(!r || !r.item) return;
    const t = S.docs[r.mode === 'article' ? r.item.files.article : r.item.files.linkedin]; if(t) copy(t);
  });
}

async function connect(){
  const repo = $('c-repo').value.trim().replace(/^https?:\/\/github\.com\//, ''), token = $('c-token').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token){ toast('Enter the repo as owner/name and your token'); return; }
  const prev = S.conn; S.conn = {repo, token};
  const r = await gh('').catch(() => null);
  if(!r || !r.ok){ S.conn = prev; toast('Could not reach that repo with that token', 4200); return; }
  LS.set('dd_conn', S.conn); history.replaceState(null, '', location.pathname); S.tab = 'capture'; S.stack = []; S.reader = null; render(); load();
}

$('refresh').onclick = () => load();
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.conn && S.loaded) load(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
/* ---- back button: one step at a time (reader > previous tab > Capture); double press on Capture exits ---- */
let exitAt = 0;
try{ history.replaceState({s:0}, ''); history.pushState({s:1}, ''); }catch(e){}
window.addEventListener('popstate', () => {
  const rearm = () => { try{ history.pushState({s:1}, ''); }catch(e){} };
  if(S.dlgCancel){ S.dlgCancel(); return rearm(); }
  if(S.reader){
    if(S.reader.type === 'post' && S.reader.file){ S.reader.file = null; S.reader.edit = false; render(); return rearm(); }
    S.reader = null; render(); return rearm();
  }
  if(S.stack.length){ S.tab = S.stack.pop(); render(); return rearm(); }
  if(S.conn && S.tab !== 'capture'){ S.tab = 'capture'; render(); return rearm(); }
  const now = Date.now();
  if(now - exitAt < 2200){ history.back(); return; }
  exitAt = now; toast('Press back again to exit'); rearm();
});
setInterval(() => {
  const a = document.activeElement, typing = a && /TEXTAREA|INPUT|SELECT/.test(a.tagName);
  if(S.conn && !S.loading && !document.hidden && !typing && (anyRunning() || Date.now() < S.pollUntil)) load();
}, 9000);
render(); if(S.conn) load();
</script>
